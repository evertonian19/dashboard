<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236D4AE0'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='%23fff'/%3E%3Cpath d='M16 10.6l4.3 3.1-1.6 5h-5.4l-1.6-5z' fill='%231B1630'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fldmg</title>
  <meta name="theme-color" content="#0F121A">
  <script>
    // 화면이 그려지기 전에 주간/야간 모드를 정합니다 (깜빡임 방지).
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      try { t = t || localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = 'dark';   // FM 기본 화면은 어두운 스킨
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/fm-theme.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/fm-layout.css">
  <link rel="stylesheet" href="css/favorites.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/sky.css">
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"><div class="sky-stars"></div><div class="sky-grass"></div></div>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <div class="app" id="app">
    <!-- 좌측 메뉴바 -->
    <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Fldmg</span>
      </div>

      <p class="nav-label">메뉴</p>
      <nav class="nav" id="nav"><!-- js/app.js 의 MENUS 로 채워집니다 --></nav>

      <div class="sidebar-foot">
        <nav class="nav" id="footNav" aria-label="설정"><!-- 설정 메뉴 (js/app.js 의 foot: true) --></nav>
        <button class="foot-btn" type="button" id="collapseBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5"/><path d="M4 4v16"/></svg>
          <span class="nav-text">메뉴 접기</span>
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <!-- 본문 -->
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn only-mobile" type="button" id="menuBtn" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <!-- FM 상단 컨텍스트: 뒤로/앞으로 + 현재 화면 이름 -->
        <div class="ctx">
          <button class="icon-btn hist" type="button" id="backBtn" aria-label="뒤로" title="뒤로">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5"/></svg>
          </button>
          <button class="icon-btn hist" type="button" id="fwdBtn" aria-label="앞으로" title="앞으로">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg>
          </button>
        </div>

        <!-- 클럽 문장 + 주 메뉴 (FM27: 상단에 고정된 주 메뉴 바) -->
        <a class="club" href="#menu1" aria-label="처음 화면">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="club-name">Fldmg</span>
        </a>
        <nav class="topnav" id="topNav" aria-label="주 메뉴"><!-- js/app.js 의 MENUS 로 채워집니다 --></nav>

        <div class="search-wrap" id="searchWrap">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
            <input type="search" id="searchInput" placeholder="메뉴, 파일 이름 검색" aria-label="검색" autocomplete="off">
          </label>
          <div class="search-panel" id="searchPanel" hidden></div>
        </div>

        <div class="topbar-right">
          <button class="icon-btn" type="button" id="themeBtn" aria-label="주간/야간 모드 전환" title="주간/야간 모드">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
          </button>
          <button class="icon-btn" type="button" id="logoutBtn" aria-label="로그아웃" title="로그아웃">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H6a1 1 0 00-1 1v14a1 1 0 001 1h4"/><path d="M15 8l4 4-4 4M19 12H9"/></svg>
          </button>
          <span class="avatar" aria-hidden="true">나</span>
        </div>
      </header>

      <!-- 보조 메뉴 바: 현재 위치 + 화면이 setSubTabs() 로 채우는 탭 -->
      <nav class="subtabs" id="subTabs" aria-label="보조 메뉴">
        <div class="crumb" aria-live="polite"><span class="crumb-site">Fldmg</span><i aria-hidden="true">›</i><b id="ctxTitle"></b></div>
        <div class="sub-slot" id="subSlot"></div>
      </nav>

      <div class="sky-band" aria-hidden="true"><span class="sun"></span><span class="moon"><svg viewBox="-22 -22 44 44" aria-hidden="true"><defs>
<radialGradient id="mBase" cx=".4" cy=".36" r=".85"><stop offset="0" stop-color="#fff8cc"/><stop offset=".5" stop-color="#f4d86e"/><stop offset="1" stop-color="#c99a2b"/></radialGradient>
<radialGradient id="mLimb" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#3a2600" stop-opacity="0"/><stop offset="1" stop-color="#3a2600" stop-opacity=".6"/></radialGradient>
<radialGradient id="mCrater" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7c5810" stop-opacity=".45"/><stop offset=".62" stop-color="#9a7218" stop-opacity=".28"/><stop offset=".84" stop-color="#7c5810" stop-opacity=".12"/><stop offset=".92" stop-color="#fff4b8" stop-opacity=".55"/><stop offset="1" stop-color="#fff4b8" stop-opacity="0"/></radialGradient>
<filter id="mBlur" filterUnits="userSpaceOnUse" x="-22" y="-22" width="44" height="44"><feGaussianBlur stdDeviation=".9"/></filter>
<filter id="mTerm" filterUnits="userSpaceOnUse" x="-22" y="-22" width="44" height="44"><feGaussianBlur stdDeviation="1.5"/></filter>
<filter id="mGrain" filterUnits="userSpaceOnUse" x="-22" y="-22" width="44" height="44"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .36  0 0 0 0 .08  0 0 0 .9 -.28"/></filter>
<clipPath id="mDisc"><circle r="20"/></clipPath>
<mask id="mLitMask" maskUnits="userSpaceOnUse" x="-22" y="-22" width="44" height="44"><path id="moonLit" d="" fill="#fff" filter="url(#mTerm)"/></mask>
</defs>
<circle r="20" fill="#272c4a" opacity=".9"/><circle r="20" fill="#8fa2cc" opacity=".1"/>
<g clip-path="url(#mDisc)"><g mask="url(#mLitMask)">
<circle r="20" fill="url(#mBase)"/>
<rect x="-20" y="-20" width="40" height="40" fill="#000" filter="url(#mGrain)" opacity=".4"/>
<g filter="url(#mBlur)" fill="#8f6a14" opacity=".42"><ellipse cx="-6" cy="-8" rx="7.5" ry="6.4"/><circle cx="4.5" cy="-8.2" r="4.2"/><ellipse cx="9.2" cy="-1" rx="5.6" ry="4.2" transform="rotate(-20 9.2 -1)"/><ellipse cx="15.4" cy="-6" rx="2.7" ry="2"/><ellipse cx="14" cy="5.2" rx="3.2" ry="3.6"/><ellipse cx="-13.4" cy="-.5" rx="5" ry="9"/><circle cx="-7" cy="9" r="3.3"/><circle cx="-12.4" cy="8" r="2.3"/><circle cx="9" cy="4.6" r="1.9"/></g>
<g stroke="#fff6c8" stroke-width=".4" opacity=".32" filter="url(#mBlur)"><line x1="0" y1="13.4" x2="-12" y2="3"/><line x1="0" y1="13.4" x2="-6" y2="-2"/><line x1="0" y1="13.4" x2="1" y2="-4"/><line x1="0" y1="13.4" x2="8" y2="0"/><line x1="0" y1="13.4" x2="13" y2="7"/><line x1="0" y1="13.4" x2="-9" y2="10"/><line x1="0" y1="13.4" x2="10" y2="14"/></g>
<circle cx="-5.5" cy="-1.6" r="1.8" fill="url(#mCrater)"/><circle cx="-10.2" cy="-4.2" r="1.1" fill="url(#mCrater)"/><circle cx="-11.2" cy="-7.4" r="1.0" fill="url(#mCrater)"/><circle cx="-3" cy="-14.6" r="1.7" fill="url(#mCrater)"/><circle cx="0" cy="13.4" r="1.9" fill="url(#mCrater)"/><circle cx="-2.5" cy="16.2" r="2.3" fill="url(#mCrater)"/><circle cx="-17" cy="2" r="1.8" fill="url(#mCrater)"/><circle cx="16" cy="2.4" r="1.5" fill="url(#mCrater)"/><circle cx="6" cy="6.5" r="1.1" fill="url(#mCrater)"/><circle cx="-8" cy="5" r="1.2" fill="url(#mCrater)"/><circle cx="12" cy="-12" r="1.2" fill="url(#mCrater)"/><circle cx="3.5" cy="-3.5" r="0.9" fill="url(#mCrater)"/><circle cx="-15" cy="-9" r="0.9" fill="url(#mCrater)"/><circle cx="8" cy="15" r="1.3" fill="url(#mCrater)"/><circle cx="-6" cy="13" r="1.0" fill="url(#mCrater)"/>
<circle r="20" fill="url(#mLimb)"/>
</g></g></svg></span></div>

      <main class="main" id="main" tabindex="-1"><!-- 현재 메뉴 화면이 여기에 그려집니다 --></main>

      <footer class="statusbar" aria-hidden="true">
        <span id="sbClock"></span>
        <span class="sb-spacer"></span>
        <span class="sb-live">● 연결됨</span>
      </footer>
    </div>
  </div>

  <div class="sat-layer" aria-hidden="true"><div class="sat" hidden></div></div>

  <!-- 삭제 확인 -->
  <dialog class="dialog" id="confirmDialog">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button class="btn btn-soft" value="cancel">취소</button>
        <button class="btn btn-danger" value="ok">삭제</button>
      </div>
    </form>
  </dialog>

  <!-- 메인 화면 카드 편집 -->
  <dialog class="dialog home-dialog" id="homeDialog" aria-labelledby="homeDialogTitle">
    <h2 id="homeDialogTitle">메인 화면 편집</h2>
    <p>보일 카드를 고르고 화살표로 순서를 바꾸세요.</p>
    <ul class="rows" id="homeCardList"></ul>
    <div class="home-dialog-actions">
      <button class="btn btn-ghost btn-sm" type="button" data-do="reset">기본값으로</button>
      <span></span>
      <button class="btn btn-soft" type="button" data-do="cancel">취소</button>
      <button class="btn btn-blue" type="button" data-do="save">저장</button>
    </div>
  </dialog>

  <!-- 문서 미리보기 -->
  <dialog class="dialog preview" id="previewDialog" aria-labelledby="previewTitle">
    <header class="preview-head">
      <h2 id="previewTitle"></h2>
      <button class="icon-btn" type="button" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="preview-body" id="previewBody"></div>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
