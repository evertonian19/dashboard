<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/assets/ball/icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · Fldmg</title>
  <meta name="theme-color" content="#0F121A">
  <script>
    (function () {
      var t; try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/fm-theme.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/fm-layout.css">
  <link rel="stylesheet" href="css/favorites.css">
  <link rel="stylesheet" href="css/brand.css">
</head>
<body>
  <main class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="login-brand"><span class="brand-mark" aria-hidden="true"></span><span>Fldmg</span></div>
      <h1>로그인</h1>
      <p class="login-desc">대시보드를 보려면 로그인하세요.</p>
      <label class="login-label" for="loginId">아이디</label>
      <input class="field" id="loginId" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label class="login-label" for="loginPw">비밀번호</label>
      <input class="field" id="loginPw" name="password" type="password" autocomplete="current-password" required>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn-blue" type="submit" id="loginBtn">로그인</button>
      <p class="login-note">로그인 후 6시간이 지나면 자동으로 로그아웃됩니다.</p>
    </form>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
